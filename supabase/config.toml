# Supabase CLI settings for local development (`supabase start`).
# The hosted project is configured in the dashboard; keep the two in step.
project_id = "fbla-store"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email: every message lands in Mailpit at http://localhost:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:8888"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sign-up stays on so a listed member's first code creates their account;
# the before-user-created hook below turns away everyone not on the list.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600
max_frequency = "30s"

# Sign-in codes, not links: the templates show {{ .Token }}.
[auth.email.template.magic_link]
subject = "Your CPPHS FBLA Store sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your CPPHS FBLA Store sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

# In production Supabase Auth sends through Resend's SMTP (set in the
# dashboard under Authentication > SMTP, with the RESEND_API_KEY as password).
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "store@your-chapter-domain.org"
# sender_name = "CPPHS FBLA Store"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[auth.external.google]
# Later, once district IT configures the app for student accounts.
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
