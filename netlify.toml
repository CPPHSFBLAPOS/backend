# The backend Netlify site: functions only. The frontend site proxies
# /api/* here (see the frontend repo's netlify.toml), so the browser only
# ever talks to one origin.
[build]
  command = "echo 'functions only'"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  port = 8888
  framework = "#static"
  publish = "public"
